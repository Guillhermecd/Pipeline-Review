[project]
name = "fiscal-worker"
version = "0.1.0"
description = "Pipeline Fiscal worker: OCR and structured extraction of fiscal documents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiokafka>=0.12",
    "aio-pika>=9.5",
    "boto3>=1.35",
    "google-genai>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    # Same distribution PaddleOCR pulls in. Two opencv-* packages share the cv2 module and break it.
    "opencv-contrib-python>=4.10",
    "paddleocr>=3.0",
    "paddlepaddle>=3.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymupdf>=1.24",
    "pyzbar>=0.1.9",
]

[project.scripts]
fiscal-worker = "fiscal_worker.main:run"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "mypy>=1.13",
    "pillow>=11.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "segno>=1.6",
    "testcontainers[kafka,rabbitmq,minio]>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fiscal_worker"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "BLE", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
untyped_calls_exclude = ["pymupdf"]

[[tool.mypy.overrides]]
module = [
    "aiokafka.*",
    "boto3.*",
    "botocore.*",
    "cv2.*",
    "fitz.*",
    "paddleocr.*",
    "pymupdf.*",
    "pyzbar.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["scripts", "tests"]
markers = [
    "integration: needs Docker (Testcontainers)",
    "ocr: runs the real PaddleOCR models (slow on first run, downloads weights)",
]
