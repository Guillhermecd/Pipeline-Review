<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#F3F1EC}a{color:#E2572B}a:hover{color:#1B1B18}</style>
</helmet>
<div style="position:fixed;inset:0">
  <dc-import name="Pipeline Fiscal App" layout="sidebar" threshold="{{threshold}}" failure-rate="{{failureRate}}" hint-size="100%,100%" style="position:absolute;inset:0"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;threshold&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.5,&quot;max&quot;:0.99,&quot;step&quot;:0.01,&quot;default&quot;:0.85,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Simulação&quot;},&quot;failureRate&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;default&quot;:0.25,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Simulação&quot;}}">
class Component extends DCLogic {
  renderVals(){ return { threshold: this.props.threshold ?? 0.85, failureRate: this.props.failureRate ?? 0.25 }; }
}
</script>
</body>
</html>
